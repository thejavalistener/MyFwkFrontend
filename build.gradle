plugins {
    id 'java-library'
    id 'maven-publish'
}


group = 'com.github.thejavalistener'
version = '2.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    api 'com.github.thejavalistener:MyFwkBackend:v2.0.0'
    api 'com.github.thejavalistener:MyFwkUtils:v2.0.0'
}
   

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
